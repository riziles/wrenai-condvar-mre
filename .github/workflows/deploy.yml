name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install wren-core-wasm
        run: |
          npm init -y
          npm install @wrenai/wren-core-wasm@0.4.1
          cp node_modules/@wrenai/wren-core-wasm/dist/index.js wren-core-wasm.js
          cp node_modules/@wrenai/wren-core-wasm/dist/wren_core_wasm.js .
          cp node_modules/@wrenai/wren-core-wasm/dist/wren_core_wasm_bg.wasm .

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
