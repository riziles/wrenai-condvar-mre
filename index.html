<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WrenAI condvar MRE</title>
  <style>
    body{font-family:system-ui;background:#1a1a2e;color:#eaeaea;padding:2rem;max-width:720px;margin:0 auto}
    h1{font-size:1.3rem}
    .status{padding:1rem;border-radius:8px;margin:1rem 0;font-family:monospace;font-size:0.9rem;word-break:break-all}
    .loading{background:rgba(255,255,255,0.05);color:#888}
    .ok{background:rgba(76,175,80,0.1);border:1px solid #4caf50}
    .err{background:rgba(233,69,96,0.1);border:1px solid #e94560}
    .note{color:#888;font-size:0.85rem;margin-top:2rem}
    .note a{color:#e94560}
  </style>
  <script type="module">
    import { WrenEngine } from "./wren-core-wasm.js";
    const s = document.getElementById("status");
    function log(m) { s.className="status loading"; s.textContent=m; }

    async function main() {
      log("Init...");
      const engine = await WrenEngine.init();

      const base = window.location.href.replace(/\/[^/]*$/, "/");
      log("Source dir: " + base + " (expecting " + base + "loans.parquet)");
      await engine.loadMDL({
        catalog:"wren", schema:"public",
        models:[{
          name:"loans", tableReference:{table:"loans"},
          columns:[
            {name:"id",type:"INTEGER"},{name:"state",type:"VARCHAR"},
            {name:"amount",type:"DOUBLE"},{name:"rate",type:"DOUBLE"},
            {name:"score",type:"INTEGER"}],
          primaryKey:"id"
        }],
        relationships:[], views:[]
      }, { source: base });

      log("Running COUNT(*) — triggers condvar panic...");
      await engine.query('SELECT count(*) FROM "loans"');
      s.className="status ok"; s.textContent="UNEXPECTED: query succeeded";
    }

    main().catch(e => {
      const m = (e.message||"").replace(/</g,"&lt;");
      const hit = m.includes("condvar")||m.includes("not supported");
      s.className="status "+(hit?"ok":"err");
      s.innerHTML = (hit?"✅ Reproduced: ":"❓ Unexpected: ")+m+
        "<br><br><small>Expected: <em>condvar wait not supported</em></small>";
    });
  </script>
</head>
<body>
  <h1>WrenAI wren-core-wasm condvar panic MRE</h1>
  <div id="status" class="status loading">Loading...</div>
  <div class="note">
    <a href="https://github.com/riziles/wrenai-condvar-mre">github.com/riziles/wrenai-condvar-mre</a>
  </div>
</body>
</html>
