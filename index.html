<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WrenAI condvar MRE</title>
  <style>
    body{font-family:system-ui;background:#1a1a2e;color:#eaeaea;padding:2rem;max-width:720px;margin:0 auto}
    h1{font-size:1.3rem}
    pre{background:rgba(0,0,0,0.3);padding:1rem;border-radius:8px;overflow-x:auto;font-size:0.85rem;line-height:1.5;max-height:60vh}
    .status{padding:1rem;border-radius:8px;margin:1rem 0;font-family:monospace;font-size:0.9rem}
    .loading{background:rgba(255,255,255,0.05);color:#888}
    .ok{background:rgba(76,175,80,0.1);border:1px solid #4caf50}
    .err{background:rgba(233,69,96,0.1);border:1px solid #e94560}
  </style>
  <script type="module">
    import { WrenEngine } from "./wren-core-wasm.js";

    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");

    function log(msg) {
      const t = new Date().toISOString().slice(11,23);
      logEl.textContent += `[${t}] ${msg}\n`;
      console.log(msg);
    }
    function done(msg, ok) {
      statusEl.className = "status " + (ok ? "ok" : "err");
      statusEl.textContent = msg;
    }

    async function main() {
      log("Step 1: WrenEngine.init()...");
      const engine = await WrenEngine.init();
      log("  ✓ engine initialized");

      log("Step 2: Building MDL (real Fannie Mae columns)...");
      const source = "https://pub-a0dfcedd4df848e5bfca15cca210aea5.r2.dev/2024/Q1/";
      log("  source: " + source);

      const mdl = {
        catalog:"wren", schema:"public",
        models:[{
          name:"loans", tableReference:{table:"loans"},
          columns:[
            {name:"loan_id",type:"VARCHAR"},
            {name:"original_upb",type:"DOUBLE"},
            {name:"original_interest_rate",type:"DOUBLE"},
            {name:"property_state",type:"VARCHAR"},
            {name:"borrower_credit_score_at_origination",type:"INTEGER"},
          ],
          primaryKey:"loan_id"
        }],
        relationships:[], views:[]
      };

      log("Step 3: loadMDL()...");
      await engine.loadMDL(mdl, { source });
      log("  ✓ MDL loaded");

      log("Step 4: query('SELECT count(*) FROM \"loans\"') — this should panic...");
      const result = await engine.query('SELECT count(*) FROM "loans"');
      log("  ⚠ Unexpected: query returned " + JSON.stringify(result));
      done("UNEXPECTED SUCCESS: " + JSON.stringify(result), false);
    }

    main().catch(e => {
      const msg = (e.message||String(e));
      console.error("CATCH:", msg);
      log("  ✗ ERROR: " + msg);
      const isCondvar = msg.includes("condvar") || msg.includes("not supported");
      done(isCondvar ? "✅ REPRODUCED: condvar wait not supported" : "❓ UNEXPECTED: " + msg, isCondvar);
    });
  </script>
</head>
<body>
  <h1>WrenAI wren-core-wasm condvar panic MRE</h1>
  <div id="log" class="status loading" style="white-space:pre-wrap">Waiting...</div>
  <div id="status" class="status loading"></div>
</body>
</html>
